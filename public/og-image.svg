<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Subtle radial gradient glow (top-left) -->
  <defs>
    <radialGradient id="glow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FF4D1C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D1C"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top eyebrow label -->
  <text x="80" y="120"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="700"
        letter-spacing="6"
        fill="#FF4D1C">FOR YOUR PROFESSION</text>

  <!-- Main wordmark -->
  <text x="80" y="260"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="180"
        font-weight="900"
        fill="url(#textGrad)"
        letter-spacing="-6">FYP</text>

  <!-- Tagline -->
  <text x="80" y="340"
        font-family="Arial, Helvetica, sans-serif"
        font-size="44"
        font-weight="700"
        fill="#FFFFFF">The Most Useful FYP.</text>

  <text x="80" y="400"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32"
        font-weight="400"
        fill="#9CA3AF">Turn doom scrolling into career capital.</text>

  <!-- Pill chips for career tracks -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">
    <rect x="80" y="470" width="200" height="50" rx="25" fill="#1A1A1A" stroke="#FF4D1C" stroke-width="2"/>
    <text x="180" y="502" text-anchor="middle" fill="#FF4D1C">Data Analyst</text>

    <rect x="300" y="470" width="220" height="50" rx="25" fill="#1A1A1A" stroke="#FF8C42" stroke-width="2"/>
    <text x="410" y="502" text-anchor="middle" fill="#FF8C42">UI/UX Designer</text>

    <rect x="540" y="470" width="260" height="50" rx="25" fill="#1A1A1A" stroke="#FFD60A" stroke-width="2"/>
    <text x="670" y="502" text-anchor="middle" fill="#FFD60A">Digital Marketing</text>

    <rect x="820" y="470" width="200" height="50" rx="25" fill="#1A1A1A" stroke="#22C55E" stroke-width="2"/>
    <text x="920" y="502" text-anchor="middle" fill="#22C55E">Product Mgr</text>
  </g>

  <!-- Brand mark bottom-right -->
  <g transform="translate(1080, 540)">
    <circle cx="0" cy="0" r="32" fill="#FF4D1C"/>
    <text x="0" y="8" text-anchor="middle"
          font-family="Arial Black, Arial, sans-serif"
          font-size="26" font-weight="900" fill="#0A0A0A">F</text>
  </g>
</svg>
